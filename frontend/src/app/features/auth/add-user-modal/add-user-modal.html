<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl text-slate-800">

    <div class="flex items-center justify-between pb-4 border-b border-slate-200">
      <div>
        <h2 class="text-xl font-bold text-slate-900">Add New User</h2>
        <p class="text-xs text-slate-500 mt-0.5">Create a team account within your hierarchy</p>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition"
      >
        ✕
      </button>
    </div>

    @if (errorMessage()) {
      <div class="mt-4 rounded-lg bg-red-50 border border-red-200 p-3 text-xs text-red-700">
        {{ errorMessage() }}
      </div>
    }

    @if (successMessage()) {
      <div class="mt-4 rounded-lg bg-emerald-50 border border-emerald-200 p-3 text-xs text-emerald-700">
        {{ successMessage() }}
      </div>
    }

    <form (ngSubmit)="submit()" class="mt-4 space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
          Username
        </label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          required
          placeholder="e.g. jdoe"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600"
        />
      </div>

      <div>
        <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
          Email Address
        </label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="user@example.com"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600"
        />
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
          Password
        </label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="Min 8 chars, 1 uppercase, 1 digit, 1 symbol"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600"
        />
      </div>

      <div>
        <label for="role" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
          Role
        </label>
        <select
          id="role"
          [(ngModel)]="selectedRole"
          name="role"
          required
          class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600"
        >
          @for (role of creatableRoles(); track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
        <p class="mt-1 text-[11px] text-slate-500">
          Roles available based on your account permissions.
        </p>
      </div>

      <div class="mt-6 flex justify-end gap-2 border-t border-slate-100 pt-4">
        <button
          type="button"
          (click)="close.emit()"
          [disabled]="loading()"
          class="rounded-lg border border-slate-300 px-4 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-50"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="loading() || !username || !email || !password"
          class="rounded-lg bg-blue-600 px-4 py-2 text-xs font-medium text-white hover:bg-blue-700 disabled:opacity-50 transition"
        >
          {{ loading() ? 'Creating...' : 'Create User' }}
        </button>
      </div>
    </form>

  </div>
</div>
