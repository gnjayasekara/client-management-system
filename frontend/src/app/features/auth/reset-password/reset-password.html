
<div class="flex min-h-screen items-center justify-center bg-slate-50 p-4">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">

    <h1 class="text-2xl font-semibold text-slate-900">
      Reset Password
    </h1>

    @if (success) {
      <div class="mt-5 rounded-lg bg-green-50 p-4 text-sm text-green-800">
        Your password has been reset successfully.
      </div>
      <a routerLink="/login" class="mt-5 block rounded-lg bg-blue-600 px-4 py-3 text-center text-sm font-semibold text-white hover:bg-blue-700">
        Go to Login
      </a>
    } @else if (!userId || !token) {
      <p class="mt-4 text-sm text-red-600">
        This reset link is missing required information.
      </p>
      <a routerLink="/forgot-password" class="mt-4 block text-sm font-medium text-blue-600">
        Request a new reset
      </a>
    } @else {
      <p class="mt-2 text-sm text-slate-500">
        Enter and confirm your new password.
      </p>

      @if (errorMessage) {
        <p role="alert" class="mt-4 rounded-lg bg-red-50 p-3 text-sm text-red-700">
          {{ errorMessage }}
        </p>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-5">
        <div>
          <label for="newPassword" class="mb-2 block text-sm font-medium text-slate-700">
            New Password
          </label>
          <input
            id="newPassword"
            type="password"
            formControlName="newPassword"
            autocomplete="new-password"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
          />
        </div>

        <div>
          <label for="confirmPassword" class="mb-2 block text-sm font-medium text-slate-700">
            Confirm New Password
          </label>
          <input
            id="confirmPassword"
            type="password"
            formControlName="confirmPassword"
            autocomplete="new-password"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100"
          />
        </div>

        <button
          type="submit"
          [disabled]="loading || form.invalid"
          class="w-full rounded-lg bg-blue-600 px-4 py-3 text-sm font-semibold text-white hover:bg-blue-700 disabled:opacity-50"
        >
          {{ loading ? 'Resetting...' : 'Reset Password' }}
        </button>
      </form>
    }

  </div>
</div>
