
<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-sm border border-slate-200">

    <div class="text-center">
      @if (loading) {
        <div class="mx-auto mb-5 h-12 w-12 animate-spin rounded-full border-4 border-slate-200 border-t-blue-600"></div>
        <h1 class="text-xl font-semibold text-slate-900">
          Verifying Email
        </h1>
      } @else if (success) {
        <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-green-100 text-2xl text-green-700">
          ✓
        </div>
        <h1 class="text-xl font-semibold text-slate-900">
          Email Verified
        </h1>
      } @else {
        <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-red-100 text-2xl text-red-700">
          !
        </div>
        <h1 class="text-xl font-semibold text-slate-900">
          Verification Failed
        </h1>
      }

      <p class="mt-3 text-sm leading-6 text-slate-600">
        {{ message }}
      </p>

      @if (!loading) {
        <a
          routerLink="/login"
          class="mt-6 inline-flex w-full justify-center rounded-lg bg-blue-600 px-4 py-3 text-sm font-semibold text-white hover:bg-blue-700"
        >
          Go to Login
        </a>
      }
    </div>

  </div>
</div>
