
<header class="flex h-16 items-center justify-between border-b border-slate-200 bg-white px-4 md:px-8">

  <div class="flex items-center gap-3">
    <button
      type="button"
      (click)="menuClicked.emit()"
      class="rounded-lg border border-slate-200 p-2 text-slate-700 md:hidden"
      aria-label="Toggle navigation"
    >
      ☰
    </button>

    <h2 class="text-lg font-semibold text-slate-900">
      {{ title() }}
    </h2>
  </div>

  <div class="flex items-center gap-3">
    <div class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-200 text-sm font-semibold text-slate-700">
      {{ (username() || 'U')[0].toUpperCase() }}
    </div>

    <div class="hidden flex-col sm:flex">
      <span class="text-sm font-medium text-slate-700">
        {{ username() || 'User' }}
      </span>
      <div class="flex gap-1">
        @for (role of roles(); track role) {
          <span class="inline-block text-xs font-semibold px-1.5 py-0.5 rounded bg-blue-100 text-blue-800">
            {{ role }}
          </span>
        }
      </div>
    </div>
  </div>

</header>
