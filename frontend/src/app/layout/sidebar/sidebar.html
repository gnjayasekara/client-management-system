<aside class="flex h-full flex-col bg-blue-950 text-white">

  <div class="border-b border-blue-900 px-6 py-6">
    <h1 class="text-xl font-bold">XYZ Enterprises</h1>
    <p class="mt-1 text-xs text-blue-200">
      Client Management Portal
    </p>
  </div>

  <nav class="flex-1 space-y-2 px-3 py-6">

    <a
      routerLink="/dashboard"
      routerLinkActive="bg-blue-600 text-white shadow-sm"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      class="block rounded-lg px-4 py-3 text-sm text-blue-200 transition hover:bg-blue-900 hover:text-white"
    >
      Dashboard
    </a>

    <a
      routerLink="/clients"
      routerLinkActive="bg-blue-600 text-white shadow-sm"
      (click)="closeMenu()"
      class="block rounded-lg px-4 py-3 text-sm text-blue-200 transition hover:bg-blue-900 hover:text-white"
    >
      Clients
    </a>

    <a
      routerLink="/follow-ups"
      routerLinkActive="bg-blue-600 text-white shadow-sm"
      (click)="closeMenu()"
      class="block rounded-lg px-4 py-3 text-sm text-blue-200 transition hover:bg-blue-900 hover:text-white"
    >
      Follow-ups
    </a>

  </nav>

  <div class="border-t border-blue-900 p-4 space-y-2">
    @if (authService.canCreateUser()) {
      <button
        type="button"
        (click)="openAddUser()"
        class="flex w-full items-center gap-2 rounded-lg bg-blue-800/60 px-4 py-2.5 text-left text-sm font-medium text-white hover:bg-blue-800 transition"
      >
        <span class="text-base font-bold">+</span>
        <span>Add User</span>
      </button>
    }

    <a
    routerLink="/change-password"
    class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900"
    >
    Change Password
    </a>

    <button
      type="button"
      (click)="logout()"
      class="w-full rounded-lg px-4 py-2.5 text-left text-sm text-blue-200 hover:bg-blue-900 hover:text-white transition"
    >
      Logout
    </button>
  </div>

  @if (showAddUserModal()) {
    <app-add-user-modal (close)="closeAddUser()" />
  }

</aside>
