
name: Client Management CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Build and Test .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore backend/tests/ClientManagement.UnitTests/ClientManagement.UnitTests.csproj

      - name: Build ASP.NET Core API
        run: dotnet build backend/ClientManagement.Api/ClientManagement.Api.csproj --configuration Release

      - name: Run .NET unit tests
        run: |
          dotnet test backend/tests/ClientManagement.UnitTests/ClientManagement.UnitTests.csproj \
            --configuration Release \
            --verbosity normal

  frontend:
    name: Build and Test Angular Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production

      - name: Run Angular tests
        run: npm test
        env:
          CI: 'true'
