
apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-api-config
  namespace: client-management
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:8080"

  Jwt__Issuer: "ClientManagement.Api"
  Jwt__Audience: "ClientManagement.Frontend"
  Jwt__ExpiryMinutes: "60"

  EmailSettings__Host: "smtp.gmail.com"
  EmailSettings__Port: "587"
  EmailSettings__FrontendBaseUrl: "http://localhost:8082"
