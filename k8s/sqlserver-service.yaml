
apiVersion: v1
kind: Service
metadata:
  name: cms-sqlserver-headless
  namespace: client-management

spec:
  clusterIP: None

  selector:
    app: cms-sqlserver

  ports:
    - name: sql
      port: 1433
      targetPort: 1433

---
apiVersion: v1
kind: Service
metadata:
  name: cms-sqlserver-service
  namespace: client-management

spec:
  type: ClusterIP

  selector:
    app: cms-sqlserver

  ports:
    - name: sql
      port: 1433
      targetPort: 1433
      protocol: TCP

